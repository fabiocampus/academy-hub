# Declarative Automation Bundle di Academy Hub (fase 8, ADR-0010; rilascio ADR-0013).
#
# Il rilascio lo fa il workflow .github/workflows/rilascio.yml con il service principal
# academy-rilascio: build/app è l'artifact della build, uguale per collaudo e prod;
# cambiano solo il target e le variabili. A mano (emergenza, sempre come quel service
# principal, mai con il proprio utente: lo stato del bundle sta nella sua cartella):
#
#   python scripts/prepara_app.py                       # artifact in build/app
#   export BUNDLE_VAR_rilascio=$(cat build/app/RILASCIO) BUNDLE_VAR_admin_email=...
#   databricks bundle deploy -t collaudo
#   databricks bundle run academy_hub -t collaudo        # avvia la versione caricata
#
# Workspace e credenziali non stanno qui (repository pubblico): arrivano dalle variabili
# DATABRICKS_HOST, DATABRICKS_CLIENT_ID e DATABRICKS_CLIENT_SECRET.
# Il progetto Lakebase è uno solo (Free Edition): lo possiede il target prod, il cui branch
# è quello di difetto (`production`); collaudo aggiunge il suo branch, copia di production
# al momento della creazione. La prima volta si fa quindi il deploy di prod prima di
# quello di collaudo.

bundle:
  name: academy-hub

workspace:
  # Una sola copia per target, nella cartella di chi fa il deploy (in CI: il service principal).
  root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  # Solo il codice dell'App, non tutto il repository; build/ è ignorata da Git.
  paths:
    - build/app
  include:
    - build/app/**

variables:
  admin_email:
    description: >-
      Email della persona admin_academy creata all'avvio. Mai nel repository: in CI è un
      secret dell'environment (ADR-0013).
  rilascio:
    description: >-
      SHA del commit dell'artifact, letto da build/app/RILASCIO: l'App lo mostra in /health
      e il test di fumo lo controlla (ADR-0013).
  progetto_lakebase:
    default: academy-hub
  branch_lakebase:
    description: Branch Lakebase del target.
  endpoint_lakebase:
    description: Endpoint read-write del branch.
    default: primary
  ambiente:
    description: ACADEMY_AMBIENTE dell'App.
  schema_database:
    description: >-
      Schema Postgres dell'App, di proprietà del suo service principal. Un branch nasce
      come copia di production, con lo schema dell'App di prod che il service principal
      di collaudo non può usare: ogni target non-prod ha quindi uno schema suo.
    default: academy
  catalogo:
    description: >-
      Catalogo Unity Catalog del target (ADR-0011). Cataloghi, schemi e grant li
      gestisce Terraform in infra/databricks (ADR-0012); il bundle passa solo il nome all'App.
  flag_calendario:
    description: >-
      Feature flag dell'evento di calendario (.ics) di un'iscrizione confermata
      (ACADEMY_FLAG_CALENDARIO, ADR-0014): spenta per difetto, accesa per target.
    default: "false"
  dati_prova:
    description: >-
      Dati di prova sintetici caricati all'avvio (ACADEMY_DATI_PROVA): solo collaudo,
      la configurazione dell'App li vieta in produzione.
    default: "false"
  warehouse_id:
    description: >-
      SQL warehouse con cui l'App legge i report, con l'identità dell'utente. Cercato per
      nome: l'id è del workspace e non sta nel repository.
    lookup:
      warehouse: Serverless Starter Warehouse

resources:
  apps:
    academy_hub:
      name: academy-hub-${bundle.target}
      description: Iscrizioni ai corsi dell'Academy (prototipo di studio, dati sintetici)
      source_code_path: ./build/app
      # On-behalf-of-user: il proxy passa all'App il token dell'utente con questo scope
      # (X-Forwarded-Access-Token), usato solo per le query dei report.
      user_api_scopes: [sql]
      config:
        command: ["python", "-m", "academy_hub.avvio"]
        env:
          - name: ACADEMY_AMBIENTE
            value: ${var.ambiente}
          - name: ACADEMY_IDENTITA
            value: databricks
          # Host, porta, database, utente e TLS arrivano dalle variabili PG* che la
          # risorsa postgres inietta; la password è un token generato per connessione.
          - name: ACADEMY_DATABASE_URL
            value: "postgresql+psycopg://"
          - name: ACADEMY_LAKEBASE_ENDPOINT
            value: projects/${var.progetto_lakebase}/branches/${var.branch_lakebase}/endpoints/${var.endpoint_lakebase}
          - name: ACADEMY_DATABASE_SCHEMA
            value: ${var.schema_database}
          - name: ACADEMY_FRONTEND_DIR
            value: frontend
          - name: ACADEMY_ADMIN_EMAIL
            value: ${var.admin_email}
          - name: ACADEMY_RILASCIO
            value: ${var.rilascio}
          - name: ACADEMY_FLAG_CALENDARIO
            value: ${var.flag_calendario}
          - name: ACADEMY_DATI_PROVA
            value: ${var.dati_prova}
          - name: ACADEMY_REPORT_WAREHOUSE_ID
            value_from: warehouse
          # Il catalogo lo gestisce Terraform (infra/databricks, ADR-0012).
          - name: ACADEMY_REPORT_CATALOGO
            value: ${var.catalogo}
      # La risorsa postgres dell'App sta nei target: il branch è un riferimento
      # all'endpoint del target, così il bundle crea prima Lakebase e poi l'App.

  # Parte analitica (ADR-0016). Il codice è nell'artifact (build/app/analisi), come
  # l'App: stessa versione. Job e pipeline appartengono al service principal che fa il
  # deploy (academy-rilascio) e girano con la sua identità; i grant su Unity Catalog,
  # compreso il catalogo che registra Lakebase (<catalogo>_oltp), li dà Terraform.
  pipelines:
    storico:
      name: academy-storico-${bundle.target}
      catalog: ${var.catalogo}
      schema: silver
      serverless: true
      channel: CURRENT
      # In sys.path: i file della pipeline importano il pacchetto academy_analisi accanto.
      root_path: ./build/app/analisi
      libraries:
        - file:
            path: ./build/app/analisi/pipeline_storico.py
        # Importazioni dei CSV dal volume e controlli di qualità (ADR-0017).
        - file:
            path: ./build/app/analisi/pipeline_importazioni.py
      configuration:
        academy.importazioni: /Volumes/${var.catalogo}/bronze/importazioni
      # Avvisi (fase 12, docs/runbook.md): email all'admin quando un aggiornamento fallisce.
      notifications:
        - email_recipients:
            - ${var.admin_email}
          alerts:
            - on-update-failure
            - on-update-fatal-failure

  # Alert SQL (fase 12, docs/runbook.md): ogni mattina dopo il job, email all'admin se
  # nelle ultime 24 ore c'è un esito bloccato o in errore in qualita.esiti (ADR-0017).
  alerts:
    qualita:
      display_name: academy-qualita-${bundle.target}
      warehouse_id: ${var.warehouse_id}
      query_text: >-
        SELECT count(*) AS falliti FROM ${var.catalogo}.qualita.esiti
        WHERE esito IN ('bloccato', 'errore')
        AND registrato_il > current_timestamp() - INTERVAL 24 HOURS
      evaluation:
        source:
          name: falliti
        comparison_operator: GREATER_THAN
        threshold:
          value:
            double_value: 0
        empty_result_state: OK
        notification:
          notify_on_ok: true
          subscriptions:
            - user_email: ${var.admin_email}
      schedule:
        quartz_cron_schedule: "0 0 6 * * ?"
        timezone_id: Europe/Rome

  jobs:
    analisi:
      name: academy-analisi-${bundle.target}
      description: >-
        Snapshot giornaliero di Lakebase in bronze, storico SCD 2 e importazioni in silver,
        gate di qualità, gold dei report ed esito in qualita.esiti
      max_concurrent_runs: 1
      # Avviso (fase 12, docs/runbook.md): email all'admin a ogni run fallita.
      email_notifications:
        on_failure:
          - ${var.admin_email}
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: Europe/Rome
      environments:
        # Ambiente serverless 4 (Python 3.12, come analisi/pyproject.toml).
        - environment_key: analisi
          spec:
            environment_version: "4"
      tasks:
        - task_key: snapshot
          environment_key: analisi
          spark_python_task:
            python_file: ./build/app/analisi/snapshot_bronze.py
            parameters:
              - --sorgente
              - ${var.catalogo}_oltp.${var.schema_database}
              - --destinazione
              - ${var.catalogo}.bronze
        - task_key: storico
          depends_on:
            - task_key: snapshot
          pipeline_task:
            pipeline_id: ${resources.pipelines.storico.id}
        # Gate di qualità (ADR-0017): fissa il verdetto dei file importati nuovi e fallisce
        # se uno è respinto, così il gold non si aggiorna.
        - task_key: controlli
          depends_on:
            - task_key: storico
          environment_key: analisi
          spark_python_task:
            python_file: ./build/app/analisi/controlli_qualita.py
            parameters:
              - --qualita
              - ${var.catalogo}.qualita
              - --run-id
              - "{{job.run_id}}"
        - task_key: gold
          depends_on:
            - task_key: controlli
          environment_key: analisi
          spark_python_task:
            python_file: ./build/app/analisi/aggiorna_gold.py
            parameters:
              - --silver
              - ${var.catalogo}.silver
              - --qualita
              - ${var.catalogo}.qualita
              - --gold
              - ${var.catalogo}.gold
        # Gira sempre, anche dopo un errore: registra com'è andata la passata.
        - task_key: registra_esito
          depends_on:
            - task_key: gold
          run_if: ALL_DONE
          environment_key: analisi
          spark_python_task:
            python_file: ./build/app/analisi/registra_esito.py
            parameters:
              - --qualita
              - ${var.catalogo}.qualita
              - --run-id
              - "{{job.run_id}}"
              - --controlli
              - "{{tasks.controlli.result_state}}"
              - --gold
              - "{{tasks.gold.result_state}}"

targets:
  collaudo:
    default: true
    mode: production
    variables:
      ambiente: collaudo
      branch_lakebase: collaudo
      schema_database: academy_collaudo
      catalogo: academy_collaudo
      flag_calendario: "true"
      dati_prova: "true"
    resources:
      postgres_branches:
        collaudo:
          parent: projects/${var.progetto_lakebase}
          branch_id: collaudo
          no_expiry: true
      postgres_endpoints:
        collaudo:
          parent: ${resources.postgres_branches.collaudo.id}
          endpoint_id: ${var.endpoint_lakebase}
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 0.5
          autoscaling_limit_max_cu: 1
          # Come per production: il branch nasce già con un endpoint read-write.
          replace_existing: true
      apps:
        academy_hub:
          resources:
            - name: postgres
              description: Database transazionale (Lakebase)
              postgres:
                branch: ${resources.postgres_endpoints.collaudo.parent}
                database: ${resources.postgres_endpoints.collaudo.parent}/databases/databricks-postgres
                permission: CAN_CONNECT_AND_CREATE
            - name: warehouse
              description: SQL warehouse dei report (query con l'identità dell'utente)
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE

  prod:
    mode: production
    variables:
      ambiente: produzione
      branch_lakebase: production
      catalogo: academy_prod
      # Accensione in produzione con una PR che cambia questa riga (ADR-0014).
      flag_calendario: "false"
      dati_prova: "false"
    resources:
      postgres_projects:
        academy_hub:
          project_id: ${var.progetto_lakebase}
          display_name: Academy Hub
          pg_version: 17
          lifecycle:
            prevent_destroy: true
      postgres_endpoints:
        # L'endpoint del branch di difetto nasce con il progetto (1 CU, sospeso dopo 24 ore):
        # il bundle lo prende in carico per limitarlo come quello di collaudo. La sospensione
        # non si cambia in Free Edition ("cannot be modified for this workspace tier").
        production:
          parent: ${resources.postgres_projects.academy_hub.id}/branches/production
          endpoint_id: ${var.endpoint_lakebase}
          endpoint_type: ENDPOINT_TYPE_READ_WRITE
          autoscaling_limit_min_cu: 0.5
          autoscaling_limit_max_cu: 1
          replace_existing: true
      apps:
        academy_hub:
          resources:
            - name: postgres
              description: Database transazionale (Lakebase)
              postgres:
                branch: ${resources.postgres_endpoints.production.parent}
                database: ${resources.postgres_endpoints.production.parent}/databases/databricks-postgres
                permission: CAN_CONNECT_AND_CREATE
            - name: warehouse
              description: SQL warehouse dei report (query con l'identità dell'utente)
              sql_warehouse:
                id: ${var.warehouse_id}
                permission: CAN_USE
