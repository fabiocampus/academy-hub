name: CodeQL

# Analisi statica del codice Python e dei workflow di GitHub Actions (issue #56).
# I job "CodeQL (python)" e "CodeQL (actions)" sono status check obbligatori su main;
# gli avvisi stanno in Security > Code scanning. Setup avanzato: quello predefinito
# del repository deve restare spento, altrimenti i due caricamenti si scontrano.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"  # ogni lunedì: nuove query anche senza commit

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisi:
    name: CodeQL (${{ matrix.linguaggio }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        linguaggio: [python, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          languages: ${{ matrix.linguaggio }}
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066  # v4.39.3
        with:
          category: /language:${{ matrix.linguaggio }}
