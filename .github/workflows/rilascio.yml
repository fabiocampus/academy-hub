name: Rilascio

# Rilascio continuo (ADR-0013): ogni push su main passa dalla CI, produce un solo
# artifact (build/app) e lo porta in collaudo, poi, dopo il test di fumo e
# l'approvazione nell'environment prod, in produzione. Fra gli ambienti cambiano solo
# target del bundle, variabili e secret dell'environment: il codice è lo stesso.
on:
  push:
    branches: [main]
  # Rilascio a mano dell'ultimo main (gli environment ammettono solo il ramo main).
  workflow_dispatch:

permissions:
  contents: read

# Nessuna concurrency a livello di workflow: un prod in attesa di approvazione
# bloccherebbe anche il collaudo dei push successivi. Il gruppo è per ambiente, nel job
# di rilascia-ambiente.yml.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: read

  build:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact: ${{ steps.nome.outputs.artifact }}
    env:
      # Come nel job frontend della CI: nessuno script di installazione dei pacchetti npm.
      NPM_CONFIG_IGNORE_SCRIPTS: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d  # v10.4.0
      - name: Artifact dell'App
        run: python3 scripts/prepara_app.py --rilascio "$GITHUB_SHA"
      - id: nome
        run: echo "artifact=app-$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ${{ steps.nome.outputs.artifact }}
          path: build/app
          if-no-files-found: error
          # Il rollback (rollback.yml) riusa l'artifact di un rilascio precedente.
          retention-days: 90

  collaudo:
    needs: build
    uses: ./.github/workflows/rilascia-ambiente.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: collaudo
      target: collaudo
      ambiente: collaudo
      artifact: ${{ needs.build.outputs.artifact }}
    # Senza inherit il workflow riusabile riceve un contesto `secrets` vuoto, anche
    # con `environment:` sul suo job. Il repository non ha secret propri: passano solo
    # quelli dell'environment.
    secrets: inherit

  prod:
    needs: [build, collaudo]
    uses: ./.github/workflows/rilascia-ambiente.yml
    permissions:
      contents: read
      actions: read
    with:
      environment: prod
      target: prod
      ambiente: produzione
      artifact: ${{ needs.build.outputs.artifact }}
    secrets: inherit
