name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # I test `integrazione` avviano PostgreSQL con Testcontainers: Docker è già sul runner.
      - run: uv run pytest

  immagine:
    # Build dell'immagine del backend e scansione con Trivy.
    # trivy-action fissata allo SHA di una release immutabile (dopo CVE-2026-33634).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        working-directory: backend
        run: docker build -t academy-hub-backend:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.2
          image-ref: academy-hub-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  compose:
    # Il criterio della fase 3: docker compose up da un clone pulito, senza .env;
    # dalla fase 4 il servizio migrazioni porta lo schema all'ultima versione.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: docker compose up
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health del backend
        working-directory: .
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Schema migrato da Alembic
        working-directory: .
        run: docker compose exec -T db psql -U academy -d academy -tAc "SELECT version_num FROM alembic_version" | grep -E '^[0-9]+$'
      - name: Identità con token Keycloak (US-16)
        # Token veri dal realm importato, flusso richiesta -> approvazione -> conferma
        # e casi vietati (401, 403).
        working-directory: .
        run: python3 scripts/fumo_identita.py
      - name: Prima passata del job di sistema
        # Il servizio job non ha healthcheck: "up --wait" vede solo che è partito.
        working-directory: .
        run: |
          for _ in $(seq 1 15); do
            docker compose logs job | grep -q "Passata del job" && exit 0
            sleep 2
          done
          exit 1
      - name: Log in caso di errore
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: docker compose down
        if: always()
        working-directory: .
        run: docker compose down -v

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
