name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check --output-format=github
      - run: uv run ruff format --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pyright

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      # I test `integrazione` avviano PostgreSQL con Testcontainers: Docker è già sul runner.
      - run: uv run pytest

  dipendenze:
    # Vulnerabilità note (PyPI Advisory DB e OSV) nelle versioni bloccate in uv.lock,
    # dipendenze di sviluppo comprese. Niente installazione: si controllano gli hash.
    # pip-audit stesso è in uv.lock (gruppo dev), con le sue dipendenze e i loro hash.
    # Le CVE nuove su un lock che non cambia le segnalano gli avvisi di Dependabot.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv export --locked --format requirements-txt --no-emit-project -o "$RUNNER_TEMP/requisiti.txt"
      - run: uv run pip-audit --strict --disable-pip --require-hashes -r "$RUNNER_TEMP/requisiti.txt"

  frontend:
    # React + TypeScript (frontend/): lint, formato, tipi, test, build, client allineato al
    # contratto OpenAPI e vulnerabilità note nelle dipendenze bloccate in package-lock.json.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Client generato uguale al contratto
        run: |
          npm run api:genera
          git diff --exit-code -- src/api/schema.d.ts
      - run: npm run lint
      - run: npm run formato
      - run: npm run tipi
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low

  immagine:
    # Build dell'immagine del backend e scansione con Trivy.
    # trivy-action fissata allo SHA di una release immutabile (dopo CVE-2026-33634).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Build
        working-directory: backend
        run: docker build --build-context frontend=../frontend -t academy-hub-backend:ci .
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          version: v0.76.2
          image-ref: academy-hub-backend:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

  compose:
    # Il criterio della fase 3: docker compose up da un clone pulito, senza .env;
    # dalla fase 4 il servizio migrazioni porta lo schema all'ultima versione.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: docker compose up
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health del backend
        working-directory: .
        run: curl --fail --silent --show-error http://127.0.0.1:8000/health
      - name: Schema migrato da Alembic
        working-directory: .
        run: docker compose exec -T db psql -U academy -d academy -tAc "SELECT version_num FROM alembic_version" | grep -E '^[0-9]+$'
      - name: Identità con token Keycloak (US-16)
        # Token veri dal realm importato, flusso richiesta -> approvazione -> conferma
        # e casi vietati (401, 403).
        working-directory: .
        run: python3 scripts/fumo_identita.py
      - name: Prima passata del job di sistema
        # Il servizio job non ha healthcheck: "up --wait" vede solo che è partito.
        working-directory: .
        run: |
          for _ in $(seq 1 15); do
            docker compose logs job | grep -q "Passata del job" && exit 0
            sleep 2
          done
          exit 1
      - name: Log in caso di errore
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: docker compose down
        if: always()
        working-directory: .
        run: docker compose down -v

  e2e:
    # Criterio della fase 7: richiesta -> approvazione -> conferma da browser, con il login
    # vero su Keycloak e la build servita da FastAPI (un solo processo); axe sulle pagine
    # principali di ogni profilo (ADR-0009 §15).
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: docker compose up
        working-directory: .
        run: docker compose up -d --build --wait --wait-timeout 300
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Chromium di Playwright
        run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: Report di Playwright
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
      - name: Log in caso di errore
        if: failure()
        working-directory: .
        run: docker compose logs --no-color
      - name: docker compose down
        if: always()
        working-directory: .
        run: docker compose down -v

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
