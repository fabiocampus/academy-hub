version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # ADR-0001: Python 3.11 come il runtime di Databricks Apps.
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # ADR-0001: PostgreSQL 17 come Lakebase (da riverificare nella fase 8).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
