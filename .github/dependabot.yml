version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
    groups:
      dev:
        dependency-type: development
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    # Una settimana di attesa: le versioni compromesse di solito vengono ritirate prima.
    cooldown:
      default-days: 7
    groups:
      dev:
        dependency-type: development
      mantine:
        patterns: ["@mantine/*"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
    ignore:
      # openapi-typescript 7 accetta solo TypeScript 5 (peer dependency).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react-hooks e typescript-eslint seguono ESLint: si aggiorna a mano.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # I tipi di Node seguono il runtime fissato in frontend/.nvmrc (24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: weekly
    # ADR-0001: Python 3.11 come il runtime di Databricks Apps.
    ignore:
      - dependency-name: python
        versions: [">=3.12"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # ADR-0001: PostgreSQL 17 come Lakebase (da riverificare nella fase 8).
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: terraform
    directories: ["/infra/*"]
    schedule:
      interval: weekly
    commit-message:
      prefix: "build(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
