# Ambiente locale completo: docker compose up
# I valori predefiniti sono di sviluppo; per cambiarli copia .env.example in .env.
# Le porte sono esposte solo su 127.0.0.1.
name: academy-hub

services:
  db:
    image: postgres:17.12-alpine@sha256:34261f594522cf41dfcb76aefd42b9d201098b0e6b23c9c68733f169e4218b6f
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-academy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-academy}
      POSTGRES_DB: ${POSTGRES_DB:-academy}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - dati-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2@sha256:c68e286cacd87b942ac1939a0a1481461109d6acd3a57dc496969a319a76bbf0
    # Realm "academy" (client OIDC e utenti di prova, ADR-0008) importato al primo avvio;
    # se esiste già resta com'è: per ripartire dal file, docker compose down.
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      # L'emittente dei token è sempre l'URL visto dal browser, anche quando il token
      # lo chiede qualcuno dentro la rete di compose; il backend legge le chiavi da
      # http://keycloak:8080 (backchannel dinamico).
      KC_HOSTNAME: http://localhost:${KEYCLOAK_PORT:-8080}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    volumes:
      - ./keycloak/realm-academy.json:/opt/keycloak/data/import/realm-academy.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-8080}:8080"
    healthcheck:
      # L'immagine non ha curl: interroga /health/ready sulla porta di gestione con bash.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  otel-lgtm:
    image: grafana/otel-lgtm:0.41.0@sha256:2e3290657f2f2a256c7a9175f097424a3ac5b54840741ace433e108e109348b6
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"

  # Porta lo schema all'ultima migrazione Alembic e termina; il backend parte dopo.
  migrazioni:
    build: &immagine-backend
      # Stessa immagine per i quattro servizi; il frontend è un contesto con nome perché
      # la sua build statica finisce nell'immagine del backend (ADR-0009 §14).
      context: ./backend
      additional_contexts:
        frontend: ./frontend
    command: ["python", "-m", "academy_hub.db.migrazioni"]
    environment:
      ACADEMY_DATABASE_URL: &url-db postgresql+psycopg://${POSTGRES_USER:-academy}:${POSTGRES_PASSWORD:-academy}@db:5432/${POSTGRES_DB:-academy}
    depends_on:
      db:
        condition: service_healthy

  # Persone degli utenti di prova di Keycloak e un piccolo catalogo; non fa nulla se
  # i dati ci sono già (academy_hub.db.demo).
  demo:
    build: *immagine-backend
    command: ["python", "-m", "academy_hub.db.demo"]
    environment:
      ACADEMY_AMBIENTE: ${ACADEMY_AMBIENTE:-locale}
      ACADEMY_DATABASE_URL: *url-db
    healthcheck:
      disable: true
    depends_on:
      migrazioni:
        condition: service_completed_successfully

  backend:
    build: *immagine-backend
    environment:
      ACADEMY_AMBIENTE: ${ACADEMY_AMBIENTE:-locale}
      # Identità dal token di Keycloak (ADR-0008)
      ACADEMY_IDENTITA: ${ACADEMY_IDENTITA:-oidc}
      ACADEMY_OIDC_EMITTENTE: http://localhost:${KEYCLOAK_PORT:-8080}/realms/academy
      ACADEMY_OIDC_JWKS_URL: http://keycloak:8080/realms/academy/protocol/openid-connect/certs
      ACADEMY_LIVELLO_LOG: ${ACADEMY_LIVELLO_LOG:-INFO}
      ACADEMY_SCADENZA_ANNULLAMENTO_GIORNI: ${ACADEMY_SCADENZA_ANNULLAMENTO_GIORNI:-3}
      ACADEMY_DATABASE_URL: *url-db
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-lgtm:4318
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      demo:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
      otel-lgtm:
        condition: service_started

  # Job di sistema (ADR-0007): scadenza all'inizio dell'edizione e rete di sicurezza della
  # promozione dalla lista d'attesa, una passata ogni ACADEMY_JOB_OGNI_SECONDI.
  job:
    build: *immagine-backend
    command: ["python", "-m", "academy_hub.job", "--ogni", "${ACADEMY_JOB_OGNI_SECONDI:-300}"]
    environment:
      ACADEMY_LIVELLO_LOG: ${ACADEMY_LIVELLO_LOG:-INFO}
      ACADEMY_DATABASE_URL: *url-db
    # L'healthcheck dell'immagine interroga /health del backend: qui non c'è.
    healthcheck:
      disable: true
    depends_on:
      migrazioni:
        condition: service_completed_successfully

volumes:
  dati-db:
