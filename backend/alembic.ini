# Solo per i comandi da terminale, ad esempio:
#   uv run alembic revision --autogenerate -m "descrizione"
# L'URL arriva da ACADEMY_DATABASE_URL (predefinito: PostgreSQL di docker compose).
[alembic]
script_location = %(here)s/src/academy_hub/db/schema
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
